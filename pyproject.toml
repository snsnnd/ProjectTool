[project]
name = "project-tool"
# 单一版本来源：`project_tool/version.py`。
# 这里不写死 version，hatchling 在构建时从 version.py 读 __version__，
# 避免「包元数据版本」与「运行时 pjt --version」不一致。
dynamic = ["version"]
description = "Local-first, Git-aware project state and collaboration system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
pjt = "project_tool.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "project_tool/version.py"

[tool.hatch.build.targets.wheel]
packages = ["project_tool"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 注意：addopts 里的 -q 意味着 CI 的 `uv run pytest` 也是 -q；
# 想看失败详情必须显式加 -rf/--tb=short（CI 里已经这么写了）。
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
exclude = ["^\\.venv/", "^web/"]
