# 临时：文件内二分，定位是第几个测试开始的
name: Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prefix:
    name: "win :: {{ matrix.label }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "first 2"
            sel: "tests/test_multiagent_flow.py -k 'test_parallel_agents_never_double_work or test_parallel_agents_all_hit_the_same_task_and_only_one_wins'"
          - label: "first 4"
            sel: "tests/test_multiagent_flow.py -k 'test_parallel_agents_never_double_work or test_parallel_agents_all_hit_the_same_task_and_only_one_wins or test_a_collision_switches_task_instead_of_failing or test_parallel_run_leaves_data_intact'"
          - label: "first 6"
            sel: "tests/test_multiagent_flow.py -k 'test_parallel_agents_never_double_work or test_parallel_agents_all_hit_the_same_task_and_only_one_wins or test_a_collision_switches_task_instead_of_failing or test_parallel_run_leaves_data_intact or test_every_agent_read_the_interface_contracts_first or test_events_are_attributed_to_the_right_agent'"
          - label: "first 8"
            sel: "tests/test_multiagent_flow.py -k 'test_parallel_agents_never_double_work or test_parallel_agents_all_hit_the_same_task_and_only_one_wins or test_a_collision_switches_task_instead_of_failing or test_parallel_run_leaves_data_intact or test_every_agent_read_the_interface_contracts_first or test_events_are_attributed_to_the_right_agent or test_second_claimer_is_told_to_pick_another_task or test_unclaimed_filter_hides_taken_work'"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run
        run: uv run pytest -rf --tb=short -p no:cacheprovider {{ matrix.sel }}
