# 临时诊断：把 Windows 的 pytest 失败输出推到 ci-diagnostics 分支，
# 因为 job 日志需要 auth 读不到，而 job 名字只能带有限信息。
# 定位完就删掉这个 workflow 和分支。
name: Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  win:
    name: "win :: multiagent"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run
        run: uv run pytest -rf --tb=long -p no:cacheprovider tests/test_multiagent_flow.py
      - name: Publish failure
        if: failure()
        run: |
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          "exit=$LASTEXITCODE" | Out-File diag/summary.txt
          Write-Host "see diag/ on branch ci-diagnostics"
      - name: Push diagnostics
        if: failure()
        shell: pwsh
        run: |
          git config user.name ci
          git config user.email ci@example.com
          git checkout --orphan ci-diagnostics
          git rm -r --cached . -q 2>$null
          Remove-Item -Recurse -Force * -Exclude .git -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          Copy-Item .github/workflows/ci.yml diag/ci.yml -ErrorAction SilentlyContinue
          "run id: ${{ github.run_id }}" | Out-File diag/meta.txt
          git add -A
          git commit -m "diagnostics: windows multiagent failure"
          git push -f origin ci-diagnostics
