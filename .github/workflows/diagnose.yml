# 临时：区分「单文件失败」还是「与其他文件互相干扰」
name: Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  combo:
    name: "win :: ${{ matrix.label }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: multiagent alone
            sel: tests/test_multiagent_flow.py
          - label: multiagent + claim
            sel: tests/test_multiagent_flow.py tests/test_claim.py
          - label: multiagent + coordination
            sel: tests/test_multiagent_flow.py tests/test_coordination.py
          - label: full suite
            sel: tests/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run
        run: uv run pytest -rf --tb=short -p no:cacheprovider ${{ matrix.sel }}
