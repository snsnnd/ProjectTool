# 临时诊断：把 Windows 的 pytest 失败输出推到 ci-diagnostics 分支，
# 因为 job 日志需要 auth 读不到，而 job 名字只能带有限信息。
# 定位完就删掉这个 workflow 和分支。
name: Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  win:
    name: "win :: multiagent"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run
        shell: pwsh
        run: |
          uv run pytest -rf --tb=long -p no:cacheprovider tests/test_multiagent_flow.py 2>&1 |
            Tee-Object -FilePath pytest-output.txt
          "exit=$LASTEXITCODE" | Out-File -FilePath pytest-output.txt -Append
      - name: Push diagnostics
        if: failure()
        shell: pwsh
        run: |
          git config user.name ci
          git config user.email ci@example.com
          git switch --orphan ci-diagnostics
          git reset -q
          git add pytest-output.txt
          git commit -m "diagnostics: windows multiagent failure"
          git push -f origin ci-diagnostics
