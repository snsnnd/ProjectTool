# 临时：把 Windows 的失败内容塞进 job 名字。
# job 日志需要 auth 读不到，而匿名 jobs API 会返回 job.name —— 这是唯一可靠的信道。
# 用 outputs 把上一个 job 的 pytest 摘要传给下一个 job 的名字。
name: Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    name: probe
    runs-on: windows-latest
    outputs:
      summary: ${{ steps.probe.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Probe
        id: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          uv run pytest -q -rf --tb=line -p no:cacheprovider tests/ *> probe.txt
          $code = $LASTEXITCODE
          $text = Get-Content probe.txt -Raw
          $picked = ($text -split [Environment]::NewLine) |
            Where-Object { $_ -match 'FAILED|ERROR|passed|failed' } |
            Select-Object -First 8
          $summary = (($picked | ForEach-Object { $_.Trim() }) -join ' ~ ')
          if (-not $summary) { $summary = "exit=$code but no failure lines found" }
          if ($summary.Length -gt 900) { $summary = $summary.Substring(0, 900) }
          $summary = $summary -replace '[\[\]<>#*]', ''
          "summary=$summary" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "PROBE_EXIT=$code SUMMARY=$summary"
          exit 0

  report:
    needs: probe
    name: "win :: ${{ needs.probe.outputs.summary }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo done
