# 临时：文件内二分。8 个测试单独都过，整文件跑挂 —— 找互相干扰的那一对。
# 用多个 node ID 而不是 -k，省掉 YAML 转义地狱。
name: Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prefix:
    name: "win :: ${{ matrix.label }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "first 2"
            sel: "tests/test_multiagent_flow.py::test_parallel_agents_never_double_work tests/test_multiagent_flow.py::test_parallel_agents_all_hit_the_same_task_and_only_one_wins"
          - label: "first 3"
            sel: "tests/test_multiagent_flow.py::test_parallel_agents_never_double_work tests/test_multiagent_flow.py::test_parallel_agents_all_hit_the_same_task_and_only_one_wins tests/test_multiagent_flow.py::test_a_collision_switches_task_instead_of_failing"
          - label: "first 4"
            sel: "tests/test_multiagent_flow.py::test_parallel_agents_never_double_work tests/test_multiagent_flow.py::test_parallel_agents_all_hit_the_same_task_and_only_one_wins tests/test_multiagent_flow.py::test_a_collision_switches_task_instead_of_failing tests/test_multiagent_flow.py::test_parallel_run_leaves_data_intact"
          - label: "first 6"
            sel: "tests/test_multiagent_flow.py::test_parallel_agents_never_double_work tests/test_multiagent_flow.py::test_parallel_agents_all_hit_the_same_task_and_only_one_wins tests/test_multiagent_flow.py::test_a_collision_switches_task_instead_of_failing tests/test_multiagent_flow.py::test_parallel_run_leaves_data_intact tests/test_multiagent_flow.py::test_every_agent_read_the_interface_contracts_first tests/test_multiagent_flow.py::test_events_are_attributed_to_the_right_agent"
          - label: "first 8"
            sel: "tests/test_multiagent_flow.py::test_parallel_agents_never_double_work tests/test_multiagent_flow.py::test_parallel_agents_all_hit_the_same_task_and_only_one_wins tests/test_multiagent_flow.py::test_a_collision_switches_task_instead_of_failing tests/test_multiagent_flow.py::test_parallel_run_leaves_data_intact tests/test_multiagent_flow.py::test_every_agent_read_the_interface_contracts_first tests/test_multiagent_flow.py::test_events_are_attributed_to_the_right_agent tests/test_multiagent_flow.py::test_second_claimer_is_told_to_pick_another_task tests/test_multiagent_flow.py::test_unclaimed_filter_hides_taken_work"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run
        run: "uv run pytest -rf --tb=short -p no:cacheprovider ${{ matrix.sel }}"
