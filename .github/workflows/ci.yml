name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy project_tool

      - name: Tests (pytest)
        # -rf 列出失败用例名，--tb=short 控制 traceback 长度；
        # -p no:cacheprovider 让 CI 不留 .pytest_cache（纯本地提速用）。
        run: uv run pytest -rf --tb=short -p no:cacheprovider
